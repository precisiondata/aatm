      - Vector stores: 'reference/vector_stores.md'
      - Logs: 'reference/logs.md'
      - Prompt helpers: 'reference/prompt_helpers.md'



theme:
  name: material
  custom_dir: overrides
  locale: en
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes 
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra:
  # Version selector backed by mike (see .github/workflows/docs.yml).
  version:
    provider: mike
    default: latest
    alias: true

plugins:
  - search
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [aatm]
          options:
            docstring_style: google
            show_source: true
            members_order: source

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
