# Laboratory results entity definitions
#
# This file contains the entity definitions for extracting quantitative laboratory
# results reported in clinical documents: the test, its numeric value, unit and date,
# e.g. "Hb 11.2 g/dL (03/15/2025)".
#
# Design choices:
# - One mention per reported result. The test name is the parent; value, unit and date
#   are children, so each detail is an exact span of the note.
# - Only numeric results. Qualitative results ("positive", "trace") and free-text
#   interpretations are not extracted yet.
# - Tests that are only ordered or planned, reference ranges and vital signs are
#   excluded.
# - A comparison sign written with the value ("<0.01") is the `operator` attribute; the
#   value is the number alone.
#
# OMOP CDM mapping: each test mention becomes a row of the MEASUREMENT table, built by
# aatm.omop.OmopTableBuilder from the `omop` block below. The block is never sent to
# the model.
#
# - measurement_concept_id is coded from the test name with the terminology mapper
#   (aatm.terminology_mapper.TerminologyMapper), restricted to standard concepts of the
#   Measurement domain, from any vocabulary. The builder needs a mapper for this file:
#   OmopTableBuilder(definitions, mapper=TerminologyMapper(...)).
#   Test names often leave out the specimen ("Hemoglobin" in blood or urine), so check
#   the mappings with OmopTables.mappings_dataframe().
# - unit_concept_id is the unit looked up as a UCUM code ("g/dL" -> 8713), ignoring case
#   when only one standard unit matches ("mg/dl" -> mg/dL).
# - operator_concept_id is the standard SNOMED concept of the comparison sign.
# - measurement_date is the result date when the note states a full date, else the
#   note date given with the note.
# - measurement_type_concept_id is 32858 "NLP".
#
# Filled from the note's context (see aatm.omop.ClinicalNote): person_id,
# visit_occurrence_id, visit_detail_id, provider_id and the fallback measurement_date.
# measurement_id is generated by the builder.
#
# Not filled: range_low / range_high (reference ranges), measurement_datetime, and the
# source concept columns.


- name: Laboratory test
  key: lab_test
  definition: >
    The name of a laboratory test whose result for the patient is reported in the note,
    copied as written, e.g. "Hemoglobin", "Hb", "HbA1c", "serum creatinine", "TSH" or
    "platelets". The span is the name only: never include the value, the unit, the date
    or words such as "today" (from "HbA1c 8.1% today" take "HbA1c"). Include the
    specimen or method when it is written as part of the name, e.g. "urine protein" or
    "fasting glucose". Each reported result is a separate
    mention, e.g. "creatinine 1.1 (prior 1.4)" has one mention with one value: extract
    the test again only when its name is written again.
    Does not include, and must not be extracted:
    (1) tests that are only ordered, planned or pending, without a result;
    (2) reference ranges or targets, e.g. "goal HbA1c < 7%";
    (3) vital signs and body measurements, e.g. blood pressure, heart rate,
    temperature, weight, height or BMI;
    (4) scores and scales, e.g. ECOG or Glasgow Coma Scale;
    (5) results of anyone other than the patient.
  attributes:
    - key: operator
      description: >
        The comparison sign written with the value, when there is one, e.g. "<" for
        "<0.01" or ">" for "> 90". Leave it out when the value is exact.
      labels:
        - value: "<"
          description: Less than.
        - value: "<="
          description: Less than or equal to.
        - value: ">"
          description: Greater than.
        - value: ">="
          description: Greater than or equal to.
  omop:
    table: measurement
    fields:
      person_id: {from: context.person_id}
      measurement_concept_id:
        from: text
        map: {}  # any standard concept of the Measurement domain, required by the column
      measurement_source_value: {from: text}
      measurement_date:
        - {from: child.lab_date, as: date}
        - {from: context.note_date}
      measurement_type_concept_id: {value: 32858}  # NLP
      operator_concept_id:
        from: attribute.operator
        concepts:
          "<": "SNOMED:276139006"
          "<=": "SNOMED:276137008"
          ">": "SNOMED:276140008"
          ">=": "SNOMED:276138003"
      value_as_number: {from: child.lab_value, as: float}
      value_source_value: {from: child.lab_value}
      unit_concept_id: {from: child.lab_unit, lookup: UCUM}
      unit_source_value: {from: child.lab_unit}
      provider_id: {from: context.provider_id}
      visit_occurrence_id: {from: context.visit_occurrence_id}
      visit_detail_id: {from: context.visit_detail_id}

- name: Laboratory value
  key: lab_value
  definition: >
    The numeric result of a specific laboratory test, copied as written, without the
    unit or the comparison sign, e.g. "11.2" from "Hb 11.2 g/dL", "0.01" from
    "troponin <0.01 ng/mL" or "1,2" from "creatinina 1,2 mg/dL".
  has_parent: true
  parent_key: lab_test

- name: Laboratory unit
  key: lab_unit
  definition: >
    The unit of a specific laboratory result, copied as written, e.g. "g/dL", "mg/dl",
    "%", "mmol/L" or "x10^3/uL".
  has_parent: true
  parent_key: lab_test

- name: Laboratory result date
  key: lab_date
  definition: >
    The date of a specific laboratory result, when the note links a date to that
    result, e.g. "03/15/2025" or "March 2025". Take only the date itself. Does not
    include words that only mean the time of the note, such as "today" or "current".
  has_parent: true
  parent_key: lab_test
