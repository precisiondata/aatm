# yaml-language-server: $schema=https://precisiondata.github.io/aatm/latest/schemas/entity_definitions.schema.json

# Smoking status entity definitions
#
# This file contains the entity definitions for extracting the patient's tobacco
# smoking status and cumulative exposure in pack-years from clinical documents, e.g.
# "former smoker, 30 pack-years, quit 2015".
#
# Design choices:
# - Only tobacco smoking (cigarettes, cigars, pipes). Vaping, smokeless tobacco,
#   cannabis and second-hand smoke are excluded.
# - `status` follows the LOINC answer list of 72166-2 "Tobacco smoking status" (never,
#   former, current every day, current some day, current with unknown frequency).
#   `not_current` is for "non-smoker" or "denies smoking", which do not say whether
#   the patient ever smoked. It has no LOINC answer, so it is stored as
#   value_as_concept_id = 0 ("present but unmapped") and reported as unmapped_label.
# - Pack-years is a separate entity, because it becomes a separate OMOP row.
#
# OMOP CDM mapping: both entities become rows of the OBSERVATION table, built by
# aatm.omop.OmopTableBuilder from the `omop` blocks below. The blocks are never sent to
# the model.
#
# - Smoking status: observation_concept_id is LOINC 72166-2 "Tobacco smoking status"
#   (standard, Observation domain) and value_as_concept_id its standard LOINC answer.
#   The SNOMED smoking findings ("Never smoked tobacco", "Ex-smoker") are not standard
#   and have no "Maps to" in the vocabulary, so they are not used.
# - Pack-years: observation_concept_id is LOINC 8664-5 "Cigarettes smoked total (pack
#   per year) - Reported", the number goes to value_as_number. There is no UCUM concept
#   for pack-years, so unit_concept_id is 0 and unit_source_value "pack-years".
# - observation_date is the note date: the status is as of the note.
# - observation_type_concept_id is 32858 "NLP".
#
# Filled from the note's context (see aatm.omop.ClinicalNote): person_id,
# visit_occurrence_id, visit_detail_id, provider_id and observation_date.
# observation_id is generated by the builder.
#
# Not captured: quit dates, start dates and amounts per day.


- name: Smoking status
  key: smoking_status
  definition: >
    A statement of the patient's own tobacco smoking status, copied as written, e.g.
    "never smoker", "former smoker", "quit smoking in 2015", "smokes 1 pack per day",
    "occasional smoker", "denies tobacco use" or "ex-tabagista". Each time point is a
    separate mention, e.g. "smoked for 20 years, quit in 2015" is one former-smoker
    mention, but "never smoker" in one section and "current smoker" in another are two.
    Does not include, and must not be extracted:
    (1) the smoking status of anyone other than the patient, e.g. family members;
    (2) vaping or e-cigarettes, smokeless tobacco, cannabis or second-hand smoke;
    (3) advice, counselling or plans, e.g. "advised to quit smoking";
    (4) pack-years, which are a separate entity.
  attributes:
    - key: status
      required: true
      description: The patient's smoking status stated in this mention.
      labels:
        - value: never
          description: >
            Has never smoked, e.g. "never smoker", "lifelong non-smoker", "never used
            tobacco". The note must say "never" or equivalent.
        - value: former
          description: Smoked in the past and has quit, e.g. "ex-smoker", "quit in 2015".
        - value: current_every_day
          description: Smokes now, every day, e.g. "smokes 1 pack per day", "daily smoker".
        - value: current_some_day
          description: >
            Smokes now, but not every day, e.g. "occasional smoker", "smokes on
            weekends", "social smoker".
        - value: current_unknown_frequency
          description: Smokes now, without saying how often, e.g. "current smoker", "smoker".
        - value: not_current
          description: >
            Does not smoke now, without saying whether they ever smoked, e.g.
            "non-smoker", "denies smoking", "does not smoke".
  omop:
    table: observation
    fields:
      person_id: {from: context.person_id}
      observation_concept_id: {concept: "LOINC:72166-2"}  # Tobacco smoking status
      observation_date: {from: context.note_date}
      observation_type_concept_id: {value: 32858}  # NLP
      value_as_concept_id:
        from: attribute.status
        concepts:
          never: "LOINC:LA18978-9"  # Never smoker
          former: "LOINC:LA15920-4"  # Former smoker
          current_every_day: "LOINC:LA18976-3"  # Current every day smoker
          current_some_day: "LOINC:LA18977-1"  # Current some day smoker
          current_unknown_frequency: "LOINC:LA18979-7"  # Smoker, current status unknown
          # not_current has no LOINC answer: stored as 0 (present but unmapped).
      value_source_value: {from: attribute.status}
      observation_source_value: {from: text}
      provider_id: {from: context.provider_id}
      visit_occurrence_id: {from: context.visit_occurrence_id}
      visit_detail_id: {from: context.visit_detail_id}

- name: Smoking pack-years
  key: pack_years
  definition: >
    The patient's cumulative tobacco smoking exposure in pack-years, copied as written
    with its unit, e.g. "40 pack-years", "40 pack-year history", "40 PY" or "40
    maços-ano". Does not include packs per day or years smoked written without a
    pack-year total, or the exposure of anyone other than the patient.
  omop:
    table: observation
    fields:
      person_id: {from: context.person_id}
      observation_concept_id: {concept: "LOINC:8664-5"}  # Cigarettes smoked total (pack per year)
      observation_date: {from: context.note_date}
      observation_type_concept_id: {value: 32858}  # NLP
      value_as_number: {from: child.pack_years_value, as: float}
      value_source_value: {from: child.pack_years_value}
      unit_concept_id: {value: 0}  # no UCUM concept for pack-years
      unit_source_value: {value: pack-years}
      observation_source_value: {from: text}
      provider_id: {from: context.provider_id}
      visit_occurrence_id: {from: context.visit_occurrence_id}
      visit_detail_id: {from: context.visit_detail_id}

- name: Pack-years value
  key: pack_years_value
  definition: >
    The number of pack-years, copied as written, without the unit, e.g. "40" from "40
    pack-years" or "12,5" from "12,5 maços-ano".
  has_parent: true
  parent_key: pack_years
