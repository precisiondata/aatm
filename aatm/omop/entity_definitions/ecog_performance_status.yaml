# ECOG performance status entity definitions
#
# This file contains the entity definitions for extracting the ECOG (Eastern Cooperative
# Oncology Group) performance status of a patient from clinical documents. The scale
# grades how a patient's disease affects their daily living abilities, from 0 (fully
# active) to 5 (dead). It is also called the Zubrod score or the WHO performance status,
# which use the same grades.
#
# Reference: Oken MM et al. Toxicity and response criteria of the Eastern Cooperative
# Oncology Group. Am J Clin Oncol. 1982;5(6):649-655.
#
# Design choices:
# - Only explicit statements of the ECOG/Zubrod/WHO grade are extracted. A grade is not
#   inferred from a description of function ("walks with a cane"), because that is a
#   clinical judgement the note does not record.
# - Karnofsky Performance Status (KPS, 0-100) is a different scale and is excluded.
#   Converting KPS to ECOG is lossy and should be done downstream if needed.
# - Eligibility criteria and thresholds ("ECOG <= 1 required") are not the patient's
#   status and are excluded.
# - The grades are `ordered`, so a decision model labels them as a scale (see
#   aatm.extractors.DecisionAttributeLabeller).
# - `score` holds a single grade. When the note gives a range ("ECOG 1-2"), `score` is
#   left out and `score_range_min` / `score_range_max` hold the bounds, so the two cases
#   stay distinct.
#
# OMOP CDM mapping: each ECOG mention becomes a row of the MEASUREMENT table, built by
# aatm.omop.OmopTableBuilder from the `omop` block below. The block is never sent to
# the model.
#
# - The mention is coded with SNOMED 423740007 "ECOG performance status" in
#   measurement_source_concept_id. That concept is not standard: it maps to LOINC
#   89247-1 "ECOG Performance Status score", the standard concept stored in
#   measurement_concept_id, as the CDM requires.
# - The grade goes to value_as_number, and to value_as_concept_id as the standard
#   SNOMED finding "ECOG performance status - grade N".
# - Zubrod and WHO performance status mentions are coded as ECOG too, since the grades
#   are the same.
# - A range ("ECOG 0-1") gives a row without a value; the range stays in
#   measurement_source_value.
# - measurement_date is the assessment date when the note states a full date, else the
#   note date given with the note.
# - measurement_type_concept_id is 32858 "NLP".
#
# Filled from the note's context (see aatm.omop.ClinicalNote): person_id,
# visit_occurrence_id, visit_detail_id, provider_id and the fallback measurement_date.
# measurement_id is generated by the builder.


- name: ECOG performance status
  key: ecog_performance_status
  definition: >
    An explicit statement of the patient's own ECOG performance status. The span is
    the contiguous text from the name of the scale to the grade, copied exactly with
    any words in between, e.g. "ECOG 1", "ECOG PS: 0", "ECOG performance status is 2",
    "PS ECOG 3", "Zubrod score of one", "WHO performance status 0" or "ECOG 1-2". The
    Zubrod score and the WHO performance status are the same scale and count as ECOG.
    Each time point is a separate mention, e.g. "ECOG 0 at diagnosis, now ECOG 2" has
    two mentions.
    Does not include, and must not be extracted:
    (1) eligibility criteria, cut-offs or thresholds, e.g. "requires ECOG <= 1" or
    "ECOG 0-2 eligible", which are not the patient's status;
    (2) the performance status of anyone other than the patient, e.g. in family history;
    (3) the Karnofsky Performance Status (KPS);
    (4) descriptions of function that do not state an ECOG grade, e.g. "bedbound".
  attributes:
    - key: score
      ordered: true
      description: >
        The single ECOG grade stated in this mention. Leave it out when the mention
        gives a range instead of one grade.
      labels:
        - value: "0"
          description: Fully active, able to carry on all pre-disease performance without restriction.
        - value: "1"
          description: >
            Restricted in physically strenuous activity but ambulatory and able to carry
            out work of a light or sedentary nature, e.g. light house work, office work.
        - value: "2"
          description: >
            Ambulatory and capable of all self-care but unable to carry out any work
            activities. Up and about more than 50% of waking hours.
        - value: "3"
          description: >
            Capable of only limited self-care. Confined to bed or chair more than 50% of
            waking hours.
        - value: "4"
          description: >
            Completely disabled. Cannot carry on any self-care. Totally confined to bed
            or chair.
        - value: "5"
          description: Dead.
    - key: score_range_min
      ordered: true
      description: >
        The lower grade when this mention gives a range, e.g. "0" for "ECOG 0-1". Leave
        it out when the mention gives a single grade.
      labels: &ecog_grades
        - value: "0"
          description: Grade 0.
        - value: "1"
          description: Grade 1.
        - value: "2"
          description: Grade 2.
        - value: "3"
          description: Grade 3.
        - value: "4"
          description: Grade 4.
        - value: "5"
          description: Grade 5.
    - key: score_range_max
      ordered: true
      description: >
        The higher grade when this mention gives a range, e.g. "1" for "ECOG 0-1". Leave
        it out when the mention gives a single grade.
      labels: *ecog_grades
  omop:
    table: measurement
    fields:
      person_id: {from: context.person_id}
      measurement_concept_id: {concept: "SNOMED:423740007", maps_to: true}
      measurement_source_concept_id: {concept: "SNOMED:423740007"}
      measurement_source_value: {from: text}
      measurement_date:
        - {from: child.assessment_date, as: date}
        - {from: context.note_date}
      measurement_type_concept_id: {value: 32858}  # NLP
      value_as_number: {from: attribute.score, as: float}
      value_as_concept_id:
        from: attribute.score
        concepts:
          "0": "SNOMED:425389002"  # ECOG performance status - grade 0
          "1": "SNOMED:422512005"  # ECOG performance status - grade 1
          "2": "SNOMED:422894000"  # ECOG performance status - grade 2
          "3": "SNOMED:423053003"  # ECOG performance status - grade 3
          "4": "SNOMED:423237006"  # ECOG performance status - grade 4
          "5": "SNOMED:423409001"  # ECOG performance status - grade 5
      value_source_value: {from: attribute.score}
      provider_id: {from: context.provider_id}
      visit_occurrence_id: {from: context.visit_occurrence_id}
      visit_detail_id: {from: context.visit_detail_id}

- name: ECOG assessment date
  key: assessment_date
  definition: >
    The date or clinical time point at which a specific ECOG performance status was
    assessed, when the note links it to that ECOG mention. Take only the date itself,
    e.g. "March 2024" from "at diagnosis in March 2024", or "03/15/2025". When no date
    is given, take the clinical time point, e.g. "at diagnosis", "on admission" or
    "after cycle 3". Does not include words that only mean the time of the note, such
    as "today", "now", "current" or "currently".
  has_parent: true
  parent_key: ecog_performance_status
