# yaml-language-server: $schema=https://precisiondata.github.io/aatm/latest/schemas/entity_definitions.schema.json

# Family history entity definitions
#
# This file contains the entity definitions for extracting conditions reported in the
# patient's family history, with the relative who had them, e.g. "mother had breast
# cancer" or "family history of type 2 diabetes".
#
# Design choices:
# - The mention is the condition as written in the family history statement, so it
#   can be coded like any condition name.
# - The relative is an attribute: one family member per mention. "Mother and sister
#   with breast cancer" gives two mentions of "breast cancer" only if the condition is
#   written twice; otherwise the model picks the first relative.
# - Negated statements ("no family history of colon cancer") are excluded.
#
# OMOP CDM mapping: each mention becomes a row of the OBSERVATION table, built by
# aatm.omop.OmopTableBuilder from the `omop` block below. The block is never sent to
# the model.
#
# - Following the CDM convention for family history, observation_concept_id is SNOMED
#   416471007 "Family history of clinical finding" and value_as_concept_id the
#   condition itself.
# - The condition is coded from the mention with the terminology mapper, restricted to
#   standard concepts of the Condition domain, from any vocabulary. The builder needs a
#   mapper for this file:
#   OmopTableBuilder(definitions, coder=TerminologyMapper(...)).
# - The relative goes to qualifier_concept_id as a standard SNOMED relationship concept
#   ("Mother", "Sister"...). The CDM has no dedicated column for the relative; this is
#   a convention of this file.
# - observation_date is the note date, when the history was taken.
# - observation_type_concept_id is 32858 "NLP".
#
# Filled from the note's context (see aatm.omop.ClinicalNote): person_id,
# visit_occurrence_id, visit_detail_id, provider_id and observation_date.
# observation_id is generated by the builder.
#
# Not captured: age at onset, and whether the relative is maternal or paternal.


- name: Family history condition
  key: family_history
  definition: >
    A disease or condition that a blood relative of the patient has or had, as written
    in the note, e.g. "breast cancer" from "mother had breast cancer at 45", "type 2
    diabetes" from "family history of type 2 diabetes" or "infarto" from "pai com
    infarto aos 50 anos". The span is the condition only, without the relative or the
    age.
    Does not include, and must not be extracted:
    (1) conditions of the patient;
    (2) negated statements, e.g. "no family history of colon cancer" or "family history
    negative for diabetes";
    (3) conditions of a spouse, partner or other non-blood relation;
    (4) unspecified statements such as "family history unremarkable" or
    "non-contributory";
    (5) habits or exposures of relatives, e.g. "father smokes" or "mother drinks
    socially", unless the note names a disease, e.g. "father with alcoholism".
  attributes:
    - key: relative
      description: >
        The blood relative who has or had the condition in this mention. Leave it out
        when the note only says "family history of".
      labels:
        - value: mother
          description: The patient's mother.
        - value: father
          description: The patient's father.
        - value: parent
          description: A parent, without saying which.
        - value: sister
          description: The patient's sister.
        - value: brother
          description: The patient's brother.
        - value: sibling
          description: A sibling, without saying which.
        - value: daughter
          description: The patient's daughter.
        - value: son
          description: The patient's son.
        - value: child
          description: A child of the patient, without saying which.
        - value: grandmother
          description: A grandmother, maternal or paternal.
        - value: grandfather
          description: A grandfather, maternal or paternal.
        - value: grandparent
          description: A grandparent, without saying which.
        - value: aunt
          description: An aunt.
        - value: uncle
          description: An uncle.
        - value: cousin
          description: A cousin.
        - value: other_relative
          description: Another blood relative, e.g. a niece, nephew or grandchild.
  omop:
    table: observation
    fields:
      person_id: {from: context.person_id}
      observation_concept_id: {concept: "SNOMED:416471007"}  # Family history of clinical finding
      observation_date: {from: context.note_date}
      observation_type_concept_id: {value: 32858}  # NLP
      value_as_concept_id:
        from: text
        map: {domain: Condition}
      value_source_value: {from: text}
      qualifier_concept_id:
        from: attribute.relative
        concepts:
          mother: "SNOMED:72705000"  # Mother
          father: "SNOMED:66839005"  # Father
          parent: "SNOMED:40683002"  # Parent
          sister: "SNOMED:27733009"  # Sister
          brother: "SNOMED:70924004"  # Brother
          sibling: "SNOMED:375005"  # Sibling
          daughter: "SNOMED:66089001"  # Daughter
          son: "SNOMED:65616008"  # Son
          child: "SNOMED:67822003"  # Child
          grandmother: "SNOMED:113157001"  # Grandmother
          grandfather: "SNOMED:34871008"  # Grandfather
          grandparent: "SNOMED:38312007"  # Grandparent
          aunt: "SNOMED:25211005"  # Aunt
          uncle: "SNOMED:38048003"  # Uncle
          cousin: "SNOMED:55538000"  # Cousin
          other_relative: "SNOMED:125679009"  # Blood relative
      qualifier_source_value: {from: attribute.relative}
      observation_source_value: {from: text}
      provider_id: {from: context.provider_id}
      visit_occurrence_id: {from: context.visit_occurrence_id}
      visit_detail_id: {from: context.visit_detail_id}
