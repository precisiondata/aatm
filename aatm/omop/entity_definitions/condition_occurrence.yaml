# yaml-language-server: $schema=https://precisiondata.github.io/aatm/latest/schemas/entity_definitions.schema.json

# Condition occurrence entity definitions
#
# This file contains the entity definitions for extracting the patient's conditions
# from clinical documents: diagnoses, problems, signs and symptoms, with their start and
# end dates when the note gives them, e.g. "type 2 diabetes since 2019" or "pneumonia
# from 03/01/2025 to 03/10/2025".
#
# Design choices:
# - Only conditions the patient has. The CDM table conventions
#   (https://ohdsi.github.io/CommonDataModel/cdm55.html#condition_occurrence) keep out:
#   - past diagnoses ("history of", conditions said to be resolved) and family
#     history, which belong in OBSERVATION. They have their own definitions,
#     medical_history and family_history;
#   - rule-out diagnoses and codes written while establishing the diagnosis, such as
#     "rule out" or "question of".
#   Negated conditions ("no chest pain", "denies fever") are excluded as well.
# - Suspected diagnoses ("probable pneumonia") are kept, with the status
#   `preliminary`: the CDM lists preliminary diagnoses among condition statuses.
# - Lab results, vital signs, procedures, drugs and allergies are excluded: they go to
#   other tables or definitions.
# - `status` is required: `confirmed` (stated as a fact) or `preliminary` (suspected).
# - Start and end dates are children of the condition, so each date is an exact span
#   of the note.
#
# OMOP CDM mapping: each condition mention becomes a row of the CONDITION_OCCURRENCE
# table, built by aatm.omop.OmopTableBuilder from the `omop` block below. The block is
# never sent to the model.
#
# - condition_concept_id is coded from the mention with the terminology mapper
#   (aatm.terminology_mapper.TerminologyMapper), restricted to standard concepts of the
#   Condition domain, from any vocabulary. The builder needs a mapper for this file:
#   OmopTableBuilder(definitions, coder=TerminologyMapper(...)).
# - condition_status_concept_id is the standard Condition Status concept of the status:
#   32893 "Confirmed diagnosis" or 32899 "Preliminary diagnosis". The CDM's own
#   examples of statuses are the point in the visit when the diagnosis was given
#   (admitting, principal, secondary); notes rarely say that, so it is not extracted.
# - condition_start_date is the start date when the note states one, else the note
#   date: the condition is known to be present on that date, but may have started
#   earlier. The CDM notes that most sources have no condition start date. When the
#   note gives only an end date before the note date, that date is used for both, as
#   the CDM allows for a single date.
# - condition_end_date is the end date when the note states one, e.g. at the end of an
#   episode described in a discharge summary. The CDM records most conditions as
#   snapshots without an end date. An end date before the start date is left empty and
#   reported.
# - condition_type_concept_id is 32858 "NLP".
#
# Filled from the note's context (see aatm.omop.ClinicalNote): person_id,
# visit_occurrence_id, visit_detail_id, provider_id and the fallback
# condition_start_date. condition_occurrence_id is generated by the builder.
#
# Not filled: condition_start_datetime / condition_end_datetime (NULL when the source
# has no time), stop_reason (often empty in the CDM too) and
# condition_source_concept_id (for codes of an OMOP vocabulary; the source here is
# free text).


- name: Condition name
  key: condition_name
  definition: >
    A disease, disorder, injury, sign or symptom that the patient has, copied as
    written, e.g. "Hypertension", "type 2 diabetes", "left knee osteoarthritis", "chest
    pain" or "pneumonia". Be as specific as the note: include laterality, location,
    stage or type when they are written as part of the name, e.g. "stage III colon
    cancer". The span is the condition only, without dates or words such as "since".
    A long-standing condition the patient still has counts, also when it is listed
    under past medical history, e.g. "PMH: hypertension". A condition written several
    times in the note gives one mention each time.
    Does not include, and must not be extracted:
    (1) negated conditions, e.g. "no chest pain", "denies fever" or "negative for
    malignancy";
    (2) conditions that are being ruled out or questioned, e.g. "rule out pneumonia",
    "r/o MI", "question of appendicitis" or "?fracture", and conditions already ruled
    out, e.g. "pneumonia ruled out";
    (3) past conditions the patient no longer has, e.g. "history of pneumonia",
    "h/o stroke, no sequelae", "prior appendicitis", "hepatitis C, treated and cured"
    or "pneumonia, resolved";
    (4) conditions of anyone other than the patient, e.g. "mother had breast cancer";
    (5) conditions that are only screened for, prevented or at risk of, e.g. "screening
    for colon cancer" or "risk of falls";
    (6) results of laboratory tests, vital signs and measurements, e.g. "Hb 9.8" or "BP
    150/90" (but a diagnosis named from them, e.g. "anemia", is a condition);
    (7) procedures, drugs, allergies, devices and habits such as smoking.
  attributes:
    - key: status
      required: true
      description: How the note presents this condition.
      labels:
        - value: confirmed
          description: >
            Stated as a fact, e.g. "hypertension", "diagnosed with asthma in 2010",
            "community-acquired pneumonia".
        - value: preliminary
          description: >
            A working diagnosis that is likely but not yet confirmed, e.g. "probable
            pneumonia", "presumed sepsis", "likely viral infection". Not a condition
            that is only being ruled out or questioned, which is not extracted.
  omop:
    table: condition_occurrence
    fields:
      person_id: {from: context.person_id}
      condition_concept_id:
        from: text
        map: {}  # any standard concept of the Condition domain, required by the column
      condition_source_value: {from: text}
      condition_start_date:
        - {from: child.verbatim_start_date, as: date}
        - {from: context.note_date}
      condition_end_date: {from: child.verbatim_end_date, as: date}
      condition_type_concept_id: {value: 32858}  # NLP
      condition_status_concept_id:
        from: attribute.status
        concepts:
          confirmed: "Condition Status:OMOP4976963"  # Confirmed diagnosis
          preliminary: "Condition Status:OMOP4976969"  # Preliminary diagnosis
      condition_status_source_value: {from: attribute.status}
      provider_id: {from: context.provider_id}
      visit_occurrence_id: {from: context.visit_occurrence_id}
      visit_detail_id: {from: context.visit_detail_id}

- name: Condition start date
  key: verbatim_start_date
  definition: >
    The date a specific condition of the patient started or was diagnosed, when the note
    links a date to that condition, e.g. "2019" from "type 2 diabetes since 2019",
    "March 2024" from "pneumonia in March 2024" or "05/12/2025" from "chest pain
    starting 05/12/2025". Take only the date itself. Does not include durations or
    relative times such as "for 3 days", "since childhood" or "today".
  has_parent: true
  parent_key: condition_name

- name: Condition end date
  key: verbatim_end_date
  definition: >
    The date a specific condition of the patient ended, when the note links such a date
    to that condition, e.g. "03/10/2025" from "pneumonia from 03/01/2025 to
    03/10/2025". Take only the date itself. Does not include the date of the note or of a
    visit where the condition was only mentioned.
  has_parent: true
  parent_key: condition_name
