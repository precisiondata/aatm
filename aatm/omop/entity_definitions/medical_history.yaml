# Medical history entity definitions
#
# This file contains the entity definitions for extracting the patient's past
# conditions: diagnoses the patient had and no longer has, e.g. "history of
# appendicitis", "h/o stroke, no sequelae" or "hepatitis C, treated and cured".
#
# Design choices:
# - It complements condition_occurrence. The CDM table conventions
#   (https://ohdsi.github.io/CommonDataModel/cdm55.html#condition_occurrence) say past
#   diagnoses ("history of") are not recorded in CONDITION_OCCURRENCE, so the
#   condition_occurrence definition leaves them out and this one takes them.
#   Long-standing conditions the patient still has ("PMH: hypertension") are current
#   conditions and stay in condition_occurrence.
# - The mention is the condition as written, so it can be coded like any condition name.
# - Past procedures and surgeries ("s/p appendectomy"), past drugs, family history,
#   negated and ruled-out conditions are excluded.
#
# OMOP CDM mapping: each mention becomes a row of the OBSERVATION table, built by
# aatm.omop.OmopTableBuilder from the `omop` block below. The block is never sent to
# the model.
#
# - observation_concept_id is LOINC 11348-0 "History of Past illness Narrative"
#   (standard, Observation domain) and value_as_concept_id the condition itself, as for
#   family history. The SNOMED "History of clinical finding in subject" concept is not
#   standard. The vocabulary maps precoordinated SNOMED "History of X" concepts to X
#   with "Maps to value"; their "Maps to" target is in the OMOP Extension vocabulary,
#   which this file does not require.
# - The condition is coded from the mention with the terminology mapper, restricted to
#   standard concepts of the Condition domain, from any vocabulary. The builder needs a
#   mapper for this file:
#   OmopTableBuilder(definitions, mapper=TerminologyMapper(...)).
# - observation_date is the note date, when the history was taken.
# - observation_type_concept_id is 32858 "NLP".
#
# Filled from the note's context (see aatm.omop.ClinicalNote): person_id,
# visit_occurrence_id, visit_detail_id, provider_id and observation_date.
# observation_id is generated by the builder.
#
# Not captured: when the past condition occurred or ended.


- name: Past medical condition
  key: medical_history
  definition: >
    A disease, disorder or injury that the patient had in the past and no longer has,
    as written in the note, e.g. "appendicitis" from "history of appendicitis",
    "stroke" from "h/o stroke, no sequelae", "hepatitis C" from "hepatitis C, treated
    and cured" or "pneumonia" from "pneumonia in 2019, resolved". The span is the
    condition only, without words such as "history of", "prior" or "resolved", and
    without dates.
    Does not include, and must not be extracted:
    (1) conditions the patient still has, even when long-standing or listed under past
    medical history, e.g. "PMH: hypertension, type 2 diabetes" or "asthma since
    childhood";
    (2) past procedures and surgeries, e.g. "s/p appendectomy" or "prior CABG", and past
    drugs;
    (3) conditions of anyone other than the patient, e.g. "mother had breast cancer";
    (4) negated, ruled-out or questioned conditions, e.g. "no history of stroke" or
    "rule out MI".
  omop:
    table: observation
    fields:
      person_id: {from: context.person_id}
      observation_concept_id: {concept: "LOINC:11348-0"}  # History of Past illness Narrative
      observation_date: {from: context.note_date}
      observation_type_concept_id: {value: 32858}  # NLP
      value_as_concept_id:
        from: text
        map: {domain: Condition}
      value_source_value: {from: text}
      observation_source_value: {from: text}
      provider_id: {from: context.provider_id}
      visit_occurrence_id: {from: context.visit_occurrence_id}
      visit_detail_id: {from: context.visit_detail_id}
