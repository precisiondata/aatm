# Device exposure entity definitions
#
# This file contains the entity definitions for extracting the medical devices a
# patient has or is given from clinical documents: implants, equipment and supplies,
# with their dates and number, e.g. "s/p dual-chamber pacemaker placed in 2019",
# "Foley catheter inserted today" or "walks with crutches".
#
# Design choices, following the CDM table conventions
# (https://ohdsi.github.io/CommonDataModel/cdm55.html#device_exposure). THEMIS has no
# device_exposure conventions.
# - A device is a physical object used for diagnosis or treatment by means other than
#   chemical action: implants (pacemakers, stents, artificial joints, IUDs), equipment
#   and supplies (crutches, wheelchairs, catheters, insulin pumps, CPAP machines) and
#   material used in care (sutures, dressings). Procedures are the actions, often the
#   placement of a device: from "PCI with drug-eluting stent" only the stent is a
#   device; the procedure goes to its own table.
# - Excluded: negated devices ("no pacemaker"), devices only planned or considered
#   ("candidate for ICD"), drugs, even when given through a device ("nicotine patch",
#   "insulin" but not "insulin pump"), devices of anyone other than the patient, and
#   equipment used only to examine the patient (stethoscopes, ECG machines, scanners).
# - `kind` (required) says how the note records the device: `placed` (implanted,
#   inserted, applied, prescribed or supplied in this note's encounter) or `existing`
#   (the patient already has or uses it). It decides the visit, below.
# - Start date, end date (removal) and number of devices are children of the device, so
#   each is an exact span of the note.
#
# OMOP CDM mapping: each device mention becomes a row of the DEVICE_EXPOSURE table,
# built by aatm.omop.OmopTableBuilder from the `omop` block below. The block is never
# sent to the model.
#
# - device_concept_id is coded from the mention with the terminology mapper
#   (aatm.terminology_mapper.TerminologyMapper), restricted to standard concepts of the
#   Device domain, from any vocabulary (SNOMED, in practice). The builder needs a mapper
#   for this file: OmopTableBuilder(definitions, mapper=TerminologyMapper(...)).
# - device_exposure_start_date is the start date the note gives (e.g. the implant
#   date), else the note date: the placement date for a device placed in this
#   encounter, and the date the patient is known to have it for an existing device.
# - device_exposure_end_date is the end (removal) date the note gives. The CDM fills it
#   only when the source gives it, so it is never inferred. When the note gives only an
#   end date before the note date ("Foley removed on 05/01/2025"), that date is used for
#   both start and end, as the CDM allows for a single date.
# - quantity is the number of devices the note gives, else 1: the CDM sets 1 when a
#   device exposure exists but no quantity is given.
# - device_type_concept_id is 32858 "NLP".
# - visit_occurrence_id, visit_detail_id and provider_id come from the note only for
#   devices placed in this encounter: the CDM fills the visit only when the exposure
#   was initiated in it, and the provider is the one who prescribed or implanted it.
#
# Filled from the note's context (see aatm.omop.ClinicalNote): person_id, the fallback
# start date, and the visit and provider for placed devices. device_exposure_id is
# generated by the builder.
#
# Not filled: unique_device_id and production_id (the UDI, rarely in notes), the unit
# columns (for amounts such as mL of a transfusion; NULL when the source has no unit),
# device_source_concept_id (for codes of an OMOP vocabulary; the source here is free
# text) and the datetime columns.


- name: Device name
  key: device_name
  definition: >
    A medical device the patient has, uses or is given, copied as written, e.g.
    "dual-chamber pacemaker", "drug-eluting stent", "left total knee prosthesis",
    "Foley catheter", "PICC line", "crutches", "CPAP", "insulin pump" or "hearing aids".
    A device is a physical object used for diagnosis or treatment: implants, equipment,
    supplies and materials such as sutures or dressings. The span is the device only,
    without the procedure, the number or the date (from "s/p PCI with 2 drug-eluting
    stents in 2021" take "drug-eluting stents"). Each device written in the note is a
    separate mention.
    Does not include, and must not be extracted:
    (1) procedures and other actions, e.g. "PCI", "knee replacement surgery" or
    "catheterization" (but a device named in them, e.g. "stent", is extracted);
    (2) negated devices, e.g. "no pacemaker" or "no indwelling lines";
    (3) devices only planned or considered, e.g. "candidate for ICD" or "will need a
    walker";
    (4) drugs, also when given through a device, e.g. "nicotine patch" or "insulin"
    (but "insulin pump" is a device);
    (5) devices of anyone other than the patient;
    (6) equipment used only to examine or monitor the patient during the visit, e.g.
    "stethoscope", "ECG machine", "CT scanner" or "pulse oximeter".
  attributes:
    - key: kind
      required: true
      description: How the note records this device.
      labels:
        - value: placed
          description: >
            Implanted, inserted, applied, prescribed or supplied in the encounter of
            this note, e.g. "Foley catheter inserted", "PICC placed today", "fitted
            for a knee brace", "prescribed a walker".
        - value: existing
          description: >
            The patient already has or uses it, e.g. "has a pacemaker", "s/p stent in
            2021", "walks with crutches", "uses CPAP at night", "Foley removed on
            05/01".
  omop:
    table: device_exposure
    fields:
      person_id: {from: context.person_id}
      device_concept_id:
        from: text
        map: {}  # any standard concept of the Device domain, required by the column
      device_source_value: {from: text}
      device_exposure_start_date:
        - {from: child.verbatim_start_date, as: date}
        - {from: context.note_date}
      device_exposure_end_date: {from: child.verbatim_end_date, as: date}
      device_type_concept_id: {value: 32858}  # NLP
      quantity:
        - {from: child.device_quantity, as: int}
        - {value: 1}  # the CDM's value when a device exists but no quantity is given
      provider_id:
        from: context.provider_id
        when: {attribute.kind: [placed]}
      visit_occurrence_id:
        from: context.visit_occurrence_id
        when: {attribute.kind: [placed]}
      visit_detail_id:
        from: context.visit_detail_id
        when: {attribute.kind: [placed]}

- name: Device start date
  key: verbatim_start_date
  definition: >
    The date a specific device was implanted, inserted or first used, when the note
    links a date to that device, e.g. "2019" from "pacemaker placed in 2019" or
    "03/01/2025" from "PICC line inserted on 03/01/2025". Take only the date itself.
    Does not include relative times such as "today" or "last year".
  has_parent: true
  parent_key: device_name

- name: Device end date
  key: verbatim_end_date
  definition: >
    The date a specific device was removed or its use ended, when the note links such a
    date to that device, e.g. "05/01/2025" from "Foley removed on 05/01/2025". Take only
    the date itself. Does not include relative times such as "yesterday".
  has_parent: true
  parent_key: device_name

- name: Device quantity
  key: device_quantity
  definition: >
    The number of devices of a specific mention, when the note gives it with digits,
    e.g. "2" from "2 drug-eluting stents" or "3" from "3 chest tubes". Take only the
    number.
  has_parent: true
  parent_key: device_name
